<?xml version="1.0" encoding="UTF-8"?>
<!--
  Maskable版: safe zone 80% に主要要素を収める。
  Android adaptive icon でクロップされても屋号と朝陽が欠けないように、
  全体を 80% スケール (中心 512, 範囲 ±410) に圧縮。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#FAF5E9"/>

  <!-- 朝陽 外殻 -->
  <circle cx="512" cy="468" r="192" fill="#B43A2A" opacity="0.10"/>
  <circle cx="512" cy="468" r="144" fill="#B43A2A" opacity="0.22"/>
  <!-- 中央コア -->
  <circle cx="512" cy="468" r="80" fill="#8E2C1F"/>

  <!-- 水平線 3本 -->
  <line x1="288" y1="458" x2="736" y2="458" stroke="#1C1813" stroke-width="2" opacity="0.85"/>
  <line x1="320" y1="471" x2="704" y2="471" stroke="#1C1813" stroke-width="1.5" opacity="0.55"/>
  <line x1="352" y1="482" x2="672" y2="482" stroke="#1C1813" stroke-width="1" opacity="0.35"/>

  <!-- 屋号 -->
  <text x="512" y="744" font-family="Hiragino Mincho ProN, YuMincho, serif" font-size="86" font-weight="600" letter-spacing="5" text-anchor="middle" fill="#1C1813">朝日製氷</text>
</svg>
