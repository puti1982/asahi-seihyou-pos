<?xml version="1.0" encoding="UTF-8"?>
<!--
  朝日製氷ロゴマーク v2 (暖簾デザイン)
  - 紺地に白の円相 (enso) と「氷」の毛筆書き
  - 伝統的なかき氷店の暖簾を踏襲、純氷の証
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="deepNavy" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1A3266" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#142852" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 紺地 (暖簾の藍/紺) -->
  <rect width="1024" height="1024" fill="#142852"/>
  <!-- 内側の極薄い紺グラデで深み -->
  <rect width="1024" height="1024" fill="url(#deepNavy)"/>

  <!-- 円相 (enso) - 不完全な円のブラシストローク -->
  <g transform="translate(512 504)" stroke="#FFFFFF" fill="none" stroke-linecap="round">
    <path d="M -250 30
             C -260 -150, -130 -290, 50 -290
             C 230 -290, 360 -150, 360 30
             C 360 200, 240 320, 50 320
             C -130 320, -250 220, -270 70"
          stroke-width="22" opacity="0.95"/>
    <!-- 入り(始点)の太い点 -->
    <ellipse cx="-270" cy="70" rx="14" ry="22" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- 氷 character (毛筆風 大) -->
  <text x="512" y="565"
        font-family="'Hiragino Mincho ProN W6', 'Hiragino Mincho ProN', 'Yu Mincho', 'YuMincho', serif"
        font-weight="900"
        font-size="500"
        fill="#FFFFFF"
        text-anchor="middle"
        dominant-baseline="central"
        letter-spacing="0">氷</text>

  <!-- 純氷 (右下小さく) -->
  <text x="870" y="940"
        font-family="'Hiragino Mincho ProN W6', 'Hiragino Mincho ProN', serif"
        font-weight="600"
        font-size="56"
        fill="#FFFFFF"
        text-anchor="middle"
        opacity="0.85">純氷</text>
</svg>
