<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.11 0 0 0 0 0.09 0 0 0 0 0.07 0 0 0 0.035 0"/>
    </filter>
    <radialGradient id="light" cx="35%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FAF5E9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="#FAF5E9"/>
  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.55"/>
  <rect width="1024" height="1024" fill="url(#light)"/>

  <g>
    <path d="M 720 605 C 658 605 620 558 620 510 C 620 450 660 412 720 412 C 780 412 820 450 820 510 C 820 558 782 605 720 605 Z" fill="#9DBE7A" opacity="0.25" filter="url(#softer)" transform="translate(2 3)"/>
<path d="M 720 605 C 658 605 620 558 620 510 C 620 450 660 412 720 412 C 780 412 820 450 820 510 C 820 558 782 605 720 605 Z" fill="#9DBE7A" opacity="0.62"/>
<path d="M 720 605 C 658 605 620 558 620 510 C 620 450 660 412 720 412 C 780 412 820 450 820 510 C 820 558 782 605 720 605 Z" fill="#9DBE7A" opacity="0.4"/>
    <!-- net pattern: criss-cross creases -->
    <g stroke="#FFFFFF" stroke-width="1.3" fill="none" opacity="0.55" stroke-linecap="round">
      <path d="M 640 470 Q 720 458 800 470"/>
      <path d="M 628 510 Q 720 498 812 510"/>
      <path d="M 640 550 Q 720 538 800 550"/>
      <path d="M 685 425 Q 690 510 685 595"/>
      <path d="M 720 418 Q 720 510 720 600"/>
      <path d="M 755 425 Q 750 510 755 595"/>
    </g>
    <g stroke="#5F7142" stroke-width="0.5" fill="none" opacity="0.3">
      <path d="M 660 488 Q 720 478 778 488"/>
      <path d="M 660 530 Q 720 520 778 530"/>
    </g>
    <!-- stem + leaf -->
    <path d="M 720 420 Q 716 400 724 384" stroke="#7A4F2E" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M 722 388 Q 745 380 760 396 Q 745 404 728 400 Z" fill="#7B9560" opacity="0.88"/>
    <ellipse cx="680" cy="478" rx="16" ry="12" fill="#FFFFFF" opacity="0.5" transform="rotate(-15 680 478)"/>
  </g>
</svg>