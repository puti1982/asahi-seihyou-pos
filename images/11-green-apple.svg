<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.11 0 0 0 0 0.09 0 0 0 0 0.07 0 0 0 0.035 0"/>
    </filter>
    <radialGradient id="light" cx="35%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FAF5E9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="#FAF5E9"/>
  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.55"/>
  <rect width="1024" height="1024" fill="url(#light)"/>

  <g>
    <path d="M 720 600 C 670 600 638 558 638 502 C 638 450 660 415 700 412 C 712 411 716 422 720 432 C 724 422 728 411 740 412 C 780 415 802 450 802 502 C 802 558 770 600 720 600 Z" fill="#A6C25C" opacity="0.25" filter="url(#softer)" transform="translate(2 3)"/>
<path d="M 720 600 C 670 600 638 558 638 502 C 638 450 660 415 700 412 C 712 411 716 422 720 432 C 724 422 728 411 740 412 C 780 415 802 450 802 502 C 802 558 770 600 720 600 Z" fill="#A6C25C" opacity="0.62"/>
<path d="M 720 600 C 670 600 638 558 638 502 C 638 450 660 415 700 412 C 712 411 716 422 720 432 C 724 422 728 411 740 412 C 780 415 802 450 802 502 C 802 558 770 600 720 600 Z" fill="#A6C25C" opacity="0.4"/>
    <!-- top indent (subtle) -->
    <path d="M 700 420 Q 720 432 740 420" stroke="#1C1813" stroke-width="1.5" fill="none" opacity="0.18"/>
    <!-- stem -->
    <path d="M 720 425 Q 718 405 722 392" stroke="#7A4F2E" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.82"/>
    <!-- leaf -->
    <path d="M 720 415 Q 745 395 770 400 Q 760 422 735 425 Q 722 425 720 418 Z" fill="#7B9560" opacity="0.88"/>
    <path d="M 742 405 L 760 412" stroke="#5F7142" stroke-width="0.8" opacity="0.55"/>
    <!-- highlights -->
    <ellipse cx="680" cy="470" rx="14" ry="22" fill="#FFFFFF" opacity="0.5" transform="rotate(-12 680 470)"/>
    <ellipse cx="672" cy="460" rx="5" ry="10" fill="#FFFFFF" opacity="0.85" transform="rotate(-12 672 460)"/>
  </g>
</svg>