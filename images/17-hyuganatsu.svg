<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="light" cx="35%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FAF5E9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- perf: feTurbulence(grain noise) 廃止 - GPU重く31枚並ぶと致命的 -->
  <rect width="1024" height="1024" fill="#FAF5E9"/>
  <rect width="1024" height="1024" fill="url(#light)"/>

  <g>
    <path d="M 720 600 C 660 600 622 555 622 505 C 622 450 662 412 720 412 C 778 412 818 450 818 505 C 818 555 780 600 720 600 Z" fill="#E5BE48" opacity="0.25" filter="url(#softer)" transform="translate(2 3)"/>
<path d="M 720 600 C 660 600 622 555 622 505 C 622 450 662 412 720 412 C 778 412 818 450 818 505 C 818 555 780 600 720 600 Z" fill="#E5BE48" opacity="0.62"/>
<path d="M 720 600 C 660 600 622 555 622 505 C 622 450 662 412 720 412 C 778 412 818 450 818 505 C 818 555 780 600 720 600 Z" fill="#E5BE48" opacity="0.4"/>
    <!-- thicker pith hint: inner ring -->
    <ellipse cx="720" cy="510" rx="78" ry="78" fill="none" stroke="#F8F0D8" stroke-width="3" opacity="0.5"/>
    <!-- citrus dimples -->
    <g fill="#1C1813" opacity="0.1">
      <circle cx="660" cy="470" r="1.3"/>
      <circle cx="690" cy="500" r="1.3"/>
      <circle cx="730" cy="450" r="1.3"/>
      <circle cx="760" cy="490" r="1.3"/>
      <circle cx="700" cy="540" r="1.3"/>
      <circle cx="755" cy="555" r="1.3"/>
    </g>
    <!-- leaf -->
    <path d="M 720 420 Q 696 402 672 410 Q 682 430 706 432 Q 718 430 720 425 Z" fill="#7B9560" opacity="0.88"/>
    <path d="M 720 420 Q 720 410 716 400" stroke="#7A4F2E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <ellipse cx="680" cy="470" rx="14" ry="22" fill="#FFFFFF" opacity="0.5" transform="rotate(-10 680 470)"/>
  </g>
</svg>