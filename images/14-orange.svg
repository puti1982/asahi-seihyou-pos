<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.11 0 0 0 0 0.09 0 0 0 0 0.07 0 0 0 0.035 0"/>
    </filter>
    <radialGradient id="light" cx="35%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FAF5E9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="#FAF5E9"/>
  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.55"/>
  <rect width="1024" height="1024" fill="url(#light)"/>

  <g>
    <path d="M 720 600 C 660 600 622 555 622 505 C 622 450 662 412 720 412 C 778 412 818 450 818 505 C 818 555 780 600 720 600 Z" fill="#D88B47" opacity="0.25" filter="url(#softer)" transform="translate(2 3)"/>
<path d="M 720 600 C 660 600 622 555 622 505 C 622 450 662 412 720 412 C 778 412 818 450 818 505 C 818 555 780 600 720 600 Z" fill="#D88B47" opacity="0.62"/>
<path d="M 720 600 C 660 600 622 555 622 505 C 622 450 662 412 720 412 C 778 412 818 450 818 505 C 818 555 780 600 720 600 Z" fill="#D88B47" opacity="0.4"/>
    <!-- citrus texture: subtle small dots all over -->
    <g fill="#1C1813" opacity="0.1">
      <circle cx="660" cy="460" r="1.5"/>
      <circle cx="678" cy="490" r="1.5"/>
      <circle cx="660" cy="525" r="1.5"/>
      <circle cx="690" cy="555" r="1.5"/>
      <circle cx="700" cy="475" r="1.5"/>
      <circle cx="730" cy="445" r="1.5"/>
      <circle cx="745" cy="475" r="1.5"/>
      <circle cx="765" cy="510" r="1.5"/>
      <circle cx="755" cy="550" r="1.5"/>
      <circle cx="725" cy="585" r="1.5"/>
      <circle cx="775" cy="465" r="1.5"/>
      <circle cx="785" cy="525" r="1.5"/>
      <circle cx="710" cy="510" r="1.5"/>
      <circle cx="735" cy="535" r="1.5"/>
    </g>
    <!-- top pit/dimple -->
    <ellipse cx="720" cy="425" rx="6" ry="4" fill="#1C1813" opacity="0.2"/>
    <!-- leaf -->
    <path d="M 720 420 Q 752 400 776 410 Q 766 432 740 432 Q 728 430 720 425 Z" fill="#7B9560" opacity="0.88"/>
    <path d="M 730 425 Q 748 420 765 420" stroke="#5F7142" stroke-width="0.7" fill="none" opacity="0.55"/>
    <!-- stem -->
    <path d="M 720 420 Q 720 410 718 400" stroke="#7A4F2E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <ellipse cx="680" cy="470" rx="14" ry="22" fill="#FFFFFF" opacity="0.5" transform="rotate(-10 680 470)"/>
    <ellipse cx="672" cy="460" rx="5" ry="10" fill="#FFFFFF" opacity="0.85" transform="rotate(-10 672 460)"/>
  </g>
</svg>